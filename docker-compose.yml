version: "3.9"

services:
  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py load_sample_stories && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_DB: fairytales
      POSTGRES_USER: fairytales
      POSTGRES_PASSWORD: fairytales
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairytales
      POSTGRES_USER: fairytales
      POSTGRES_PASSWORD: fairytales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
